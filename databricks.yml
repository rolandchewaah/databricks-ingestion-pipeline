bundle:
  name: ingestion_pipeline

workspace:
  root_path: /Shared/ingestion_pipeline/${bundle.target}/${env.BRANCH_SLUG}

resources:
  jobs:
    ingestion_job:
      name: "Daily Ingestion (${bundle.target}) - ${env.BRANCH_SLUG}"
      tasks:
        - task_key: run_ingestion
          job_cluster_key: jc
          python_task:
            python_file: scripts/ingest_data.py
      job_clusters:
        - job_cluster_key: jc
          new_cluster:
            spark_version: 14.3.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1

targets:
  dev:
    mode: development